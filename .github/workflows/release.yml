name: Windows Release

on:
  push:
    branches: [master]
    paths:
      - "CsvImportTool.csproj"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content CsvImportTool.csproj
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "CsvImportTool.csproj is missing the Version property."
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Set up .NET
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        if: steps.existing.outputs.exists != 'true'
        run: dotnet restore CsvImportTool.slnx

      - name: Test
        if: steps.existing.outputs.exists != 'true'
        run: dotnet test CsvImportTool.Tests/CsvImportTool.Tests.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet publish CsvImportTool.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output publish/win-x64

      - name: Package and checksum
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath CsvImportTool-win-x64.zip
          $hash = (Get-FileHash CsvImportTool-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CsvImportTool-win-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Create release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG `
            CsvImportTool-win-x64.zip `
            SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "CsvImportTool $env:RELEASE_TAG" `
            --generate-notes
